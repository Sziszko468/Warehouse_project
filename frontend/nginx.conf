server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /products) have no matching file on
    # disk, so unresolved paths fall back to index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
