x-app: &app
  build: .
  env_file: .env
  environment: &app-environment
    # overrides the .env value so the container reaches postgres/redis by their service
    # names rather than localhost (.env's DATABASE_URL is for running the app
    # directly on the host, e.g. `uv run uvicorn` or `alembic` during development)
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD:-stockflow}@postgres:5432/${POSTGRES_DB:-stockflow}
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off: runs the Alembic migrations to completion before api/celery_worker/celery_beat start,
  # so none of them can race a fresh database and query a table that doesn't exist yet. api's own
  # image CMD also runs `alembic upgrade head` before serving (harmless no-op once this has run) -
  # kept there too so the image still migrates itself when run standalone, outside this compose file.
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_worker:
    <<: *app
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_beat:
    <<: *app
    # --schedule persists beat's "last run" bookkeeping to a volume, so a container
    # restart near a trigger time can't forget it already fired today's job and re-send it.
    command: celery -A app.celery_app:celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    volumes:
      - celerybeat-data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # the browser loads this, so it must be a URL reachable from the host,
        # not the "api" in-network service name (see frontend/Dockerfile)
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  celerybeat-data:
