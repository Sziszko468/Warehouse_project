name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v4 talks to GitHub's old, retired Actions cache API - restoring a cache fails there with
      # "Cache service responded with 400" and fails the whole job; v10.2.0 uses the current API.
      # Pinned to the exact tag rather than a floating "v10" - astral-sh/setup-uv only publishes
      # rolling major-version tags up through v7 (v8/v9/v10 exist as exact releases only).
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # app.config.Settings() has no defaults for these, so just importing tests/conftest.py
      # needs them set - the suite itself only ever talks to SQLite in-memory (Celery runs eager,
      # never dialing Redis either), but a test that doesn't mock email can still make a real,
      # un-mocked notification call that opens Settings.database_url for real (see
      # email_service._active_admin_emails). "postgres"/"redis" (the Docker Compose hostnames
      # from .env.example) don't exist on this bare runner, and a plain host string on Linux hangs
      # for a long time re-trying DNS instead of failing fast - 127.0.0.1 with a closed port
      # refuses the connection immediately, so any accidental real hit fails fast rather than
      # stalling the job.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/test
          SECRET_KEY: test-secret-key-not-used-in-ci-1234
          FIRST_ADMIN_EMAIL: admin@example.com
          FIRST_ADMIN_PASSWORD: test-password
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
